<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b4f8a">
  <meta name="description" content="Registro y consulta de reportes de servicio tecnico">
  <title>Reportes de Servicio Tecnico</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido principal</a>

  <header class="app-header">
    <div class="app-header__inner">
      <div class="app-header__brand">
        <p class="app-header__eyebrow">Servicio tecnico</p>
        <h1>Reportes de Servicio</h1>
      </div>
      <p id="connection-status" class="connection-status" role="status" aria-live="polite">
        Comprobando servidor...
      </p>
    </div>
  </header>

  <main id="contenido" class="app-main">
    <section class="panel" id="staff-panel">
      <div class="panel__header"><h2>Acceso del equipo TI</h2></div>
      <form id="staff-login-form" class="field-grid">
        <div class="field"><label for="staff-email">Correo</label><input id="staff-email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="staff-password">Contraseña</label><input id="staff-password" type="password" autocomplete="current-password" required></div>
        <button type="submit" class="button button--primary">Iniciar sesion</button>
      </form>
      <p id="staff-status" role="status"></p>
    </section>
    <section class="panel" aria-labelledby="form-title">
      <div class="panel__header">
        <h2 id="form-title">Nuevo reporte</h2>
        <p>Registra la informacion del servicio realizado.</p>
      </div>

      <form id="reporte-form" novalidate>
        <div class="field">
          <label for="titulo">Titulo del reporte <span class="required" aria-hidden="true">*</span></label>
          <input
            id="titulo"
            name="titulo"
            type="text"
            maxlength="200"
            required
            aria-required="true"
            aria-describedby="error-titulo"
            autocomplete="off"
          >
          <p class="field__error" id="error-titulo" role="alert"></p>
        </div>

        <div class="field">
          <label for="descripcion">Descripcion del servicio <span class="required" aria-hidden="true">*</span></label>
          <textarea
            id="descripcion"
            name="descripcion"
            rows="4"
            maxlength="2000"
            required
            aria-required="true"
            aria-describedby="error-descripcion"
          ></textarea>
          <p class="field__error" id="error-descripcion" role="alert"></p>
        </div>

        <div class="field-grid">
          <div class="field">
            <label for="cliente">Cliente <span class="required" aria-hidden="true">*</span></label>
            <input
              id="cliente"
              name="cliente"
              type="text"
              maxlength="200"
              required
              aria-required="true"
              aria-describedby="error-cliente"
              autocomplete="organization"
            >
            <p class="field__error" id="error-cliente" role="alert"></p>
          </div>

          <div class="field">
            <label for="sitio">Sitio o ubicacion <span class="required" aria-hidden="true">*</span></label>
            <input
              id="sitio"
              name="sitio"
              type="text"
              maxlength="200"
              required
              aria-required="true"
              aria-describedby="error-sitio"
            >
            <p class="field__error" id="error-sitio" role="alert"></p>
          </div>

          <div class="field">
            <label for="fechaServicio">Fecha del servicio <span class="required" aria-hidden="true">*</span></label>
            <input
              id="fechaServicio"
              name="fechaServicio"
              type="date"
              required
              aria-required="true"
              aria-describedby="error-fechaServicio"
            >
            <p class="field__error" id="error-fechaServicio" role="alert"></p>
          </div>

          <div class="field">
            <label for="estado">Estado</label>
            <select id="estado" name="estado" aria-describedby="error-estado" disabled>
              <option value="pendiente" selected>Pendiente</option>
            </select>
            <p class="field__error" id="error-estado" role="alert"></p>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="button button--primary" id="submit-button">
            Guardar reporte
          </button>
          <p class="form-status" id="form-status" role="status" aria-live="polite" tabindex="-1"></p>
        </div>
      </form>
    </section>

    <section class="panel" aria-labelledby="list-title">
      <div class="panel__header panel__header--row">
        <div>
          <h2 id="list-title">Reportes registrados</h2>
          <p>Consulta los reportes guardados en el dispositivo y en el servidor.</p>
        </div>
        <div class="panel__actions">
          <button type="button" class="button button--ghost" id="refresh-button">
            Actualizar
          </button>
        </div>
      </div>

      <p class="sync-status" id="sync-status" role="status" aria-live="polite"></p>
      <p class="list-status" id="list-status" role="status" aria-live="polite"></p>
      <ul class="reportes" id="reportes-list"></ul>
    </section>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
